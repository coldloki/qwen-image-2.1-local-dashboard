<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qwen-studio</title>
  <!-- The CSS/JS URLs get a `?v=<sha>` query appended by the server so the
       browser always loads the matching module graph for the running build. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#generate">
        <span class="brand-mark">Q</span>
        <span class="brand-name">qwen-studio</span>
        <span class="build-tag" id="build-tag"></span>
      </a>
      <nav class="primary-nav" aria-label="Primary">
        <a href="#generate" data-tab="generate">Generate</a>
        <a href="#history" data-tab="history">History</a>
        <a href="#settings" data-tab="settings">Settings</a>
      </nav>
      <div class="actions">
        <button class="iconbtn" id="theme-btn" title="Toggle theme" aria-label="Toggle theme"></button>
      </div>
    </div>
  </header>

  <main>
    <section id="tab-generate" class="tab-content"></section>
    <section id="tab-history" class="tab-content" hidden></section>
    <section id="tab-settings" class="tab-content" hidden></section>
  </main>

  <div id="toast-container"></div>

  <script type="module" src="/static/app.js"></script>
</body>
</html>
